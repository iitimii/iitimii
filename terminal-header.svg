<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" viewBox="0 0 820 250" role="img"
     aria-label="Terminal window. $ whoami. Timi Owolabi. ML Systems Engineer · Embodied AI Researcher. Lagos, Nigeria.">
  <!--
    Palette: bg #0f1319 · bar #151a21 · border #2a313b · text #e6edf3 · dim #7d8590 · accent #e6edf3
    To match the accent on timiowolabi.com exactly, replace every #e6edf3 below.
  -->
  <style>
    text {
      font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
      font-size: 16px;
    }
    .win    { fill: #0f1319; stroke: #2a313b; stroke-width: 1; }
    .bar    { fill: #151a21; }
    .rule   { stroke: #2a313b; stroke-width: 1; }
    .dot    { fill: #2a313b; }
    .prompt { fill: #e6edf3; }
    .cmd    { fill: #e6edf3; }
    .name   { fill: #f0f6fc; font-size: 28px; font-weight: 700; }
    .title  { fill: #c9d1d9; }
    .dim    { fill: #7d8590; }
    .cursor { fill: #e6edf3; }
  </style>

  <!-- window -->
  <rect class="win" x="10.5" y="10.5" width="799" height="229" rx="10"/>

  <!-- title bar (rounded top, square bottom) -->
  <clipPath id="barclip">
    <rect x="11" y="11" width="798" height="34"/>
  </clipPath>
  <rect class="bar" x="11" y="11" width="798" height="228" rx="10" clip-path="url(#barclip)"/>
  <line class="rule" x1="11" y1="45.5" x2="809" y2="45.5"/>
  <circle class="dot" cx="32" cy="28" r="5.5"/>
  <circle class="dot" cx="50" cy="28" r="5.5"/>
  <circle class="dot" cx="68" cy="28" r="5.5"/>
  <text class="dim" x="410" y="33" text-anchor="middle">~/portfolio</text>

  <!-- line 1: typed command -->
  <text class="prompt" x="34" y="82">$</text>
  <clipPath id="typeclip">
    <rect x="54" y="66" width="0" height="22">
      <animate attributeName="width"
               values="0;10;20;30;40;50;72"
               calcMode="discrete"
               begin="0.4s" dur="0.6s" fill="freeze"/>
    </rect>
  </clipPath>
  <text class="cmd" x="54" y="82" clip-path="url(#typeclip)">whoami</text>

  <!-- output -->
  <text class="name" x="34" y="122" opacity="0">
    Timi Owolabi
    <animate attributeName="opacity" from="0" to="1" begin="1.05s" dur="0.15s" fill="freeze"/>
  </text>
  <text class="title" x="34" y="150" opacity="0">
    ML Systems Engineer · Embodied AI Researcher
    <animate attributeName="opacity" from="0" to="1" begin="1.15s" dur="0.15s" fill="freeze"/>
  </text>
  <text class="dim" x="34" y="176" opacity="0">
    // Lagos, Nigeria
    <animate attributeName="opacity" from="0" to="1" begin="1.25s" dur="0.15s" fill="freeze"/>
  </text>

  <!-- line 5: fresh prompt + blinking underscore cursor -->
  <text class="prompt" x="34" y="212" opacity="0">
    $
    <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.1s" fill="freeze"/>
  </text>
  <rect class="cursor" x="54" y="210" width="10" height="3" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" begin="1.6s" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
